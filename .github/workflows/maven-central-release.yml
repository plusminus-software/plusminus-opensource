name: Maven Central Release
on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "21"
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Import GPG Key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MAVEN_CENTRAL_PASSWORD }}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>ci-gpg</id>
                <build>
                  <plugins>
                    <plugin>
                      <groupId>org.apache.maven.plugins</groupId>
                      <artifactId>maven-gpg-plugin</artifactId>
                      <version>3.2.4</version>
                      <executions>
                        <execution>
                          <id>sign-artifacts</id>
                          <phase>verify</phase>
                          <goals>
                            <goal>sign</goal>
                          </goals>
                        </execution>
                      </executions>
                      <configuration>
                        <gpgArguments>
                          <arg>--pinentry-mode</arg>
                          <arg>loopback</arg>
                        </gpgArguments>
                        <passphrase>${{ secrets.GPG_PASSPHRASE }}</passphrase>
                      </configuration>
                    </plugin>
                  </plugins>
                </build>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Detect version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '[:space:]')
          echo "Project version: $VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy SNAPSHOT
        if: steps.version.outputs.is_snapshot == 'true'
        run: |
          mvn -B -ntp clean deploy \
            -DaltDeploymentRepository=central::default::https://central.sonatype.com/repository/maven-snapshots/

      - name: Publish Release
        if: steps.version.outputs.is_snapshot == 'false'
        run: |
          mvn -B -ntp clean verify org.sonatype.central:central-publishing-maven-plugin:0.7.0:publish \
            -Pci-gpg \
            -DpublishingServerId=central \
            -DautoPublish=true \
            -DwaitUntil=published