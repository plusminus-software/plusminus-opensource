name: Maven Central Release
on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "21"
      module:
        required: false
        type: string
        default: ""
      create-git-tag:
        required: false
        type: boolean
        default: true
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MAVEN_CENTRAL_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Detect version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '[:space:]')
          echo "Project version: $VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy SNAPSHOT
        if: steps.version.outputs.is_snapshot == 'true'
        run: |
          CMD="mvn -B -ntp clean deploy -DaltDeploymentRepository=central::default::https://central.sonatype.com/repository/maven-snapshots/"

          # If the 'module' input is provided and not empty
          if [ -n "${{ inputs.module }}" ]; then
            echo "Targeting specific module: ${{ inputs.module }}"
            # -pl: project list, -am: also make (build dependencies)
            CMD="$CMD -pl ${{ inputs.module }} -am"
          fi

          # Execute the command
          $CMD

      - name: Import GPG Key
        if: steps.version.outputs.is_snapshot == 'false'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish Release
        if: steps.version.outputs.is_snapshot == 'false'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          CMD="mvn -B -ntp clean deploy -Prelease \
            -Dgpg.passphrase=\"$GPG_PASSPHRASE\" \
            -Dgpg.arguments='--pinentry-mode=loopback'"
          
          if [ -n "${{ inputs.module }}" ]; then
            echo "Publishing specific module: ${{ inputs.module }}"
            CMD="$CMD -pl ${{ inputs.module }} -am"
          fi
          
          eval $CMD

      - name: Tag commit with Maven version
        if: ${{ inputs.create-git-tag == true }}
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODULE="${{ inputs.module }}"
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Determine tag
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="${VERSION}-${SHORT_SHA}"
          else
            TAG="$VERSION"
          fi
          
          # Include module name if provided
          if [ -n "$MODULE" ]; then
            TAG="${MODULE}-${TAG}"
          fi
          
          echo "Tagging commit with: $TAG"
          
          # Skip if tag exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            exit 0
          fi
          
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish job summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODULE="${{ inputs.module }}"
          TAG="${{ steps.tag.outputs.tag }}"
          
          if [[ "${{ steps.version.outputs.is_snapshot }}" == "true" ]]; then
            TYPE="SNAPSHOT"
          else
            TYPE="RELEASE"
          fi
          
          echo "## Maven Central Publish Result 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** $TYPE" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$MODULE" ]; then
            echo "- **Module:** $MODULE" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -n "$TAG" ]; then
            echo "- **Git tag:** $TAG" >> $GITHUB_STEP_SUMMARY
          fi