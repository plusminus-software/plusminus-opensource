name: Maven Central Release

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "21"

    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MAVEN_CENTRAL_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Detect version and repository
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"

          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            REPO_URL=https://central.sonatype.com/repository/maven-snapshots/
            echo "Snapshot version detected, using $REPO_URL"
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
          else
            REPO_URL=https://central.sonatype.com/repository/maven-releases/
            echo "Release version detected, using $REPO_URL"
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
          fi
          echo "repo_url=$REPO_URL" >> $GITHUB_OUTPUT

      - name: Build, Sign and Deploy
        run: |
          mvn -B -ntp clean deploy \
            org.apache.maven.plugins:maven-gpg-plugin:3.2.4:sign \
            -Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }} \
            -Dgpg.pinentry.mode=loopback \
            -DaltDeploymentRepository=central::default::${{ steps.version.outputs.repo_url }}

      - name: Publish release to Maven Central
        if: steps.version.outputs.is_snapshot == 'false'
        run: |
          mvn org.sonatype.central:central-publishing-maven-plugin:0.7.0:publish \
            -DpublishingServerId=central \
            -DautoPublish=true \
            -DwaitUntil=published