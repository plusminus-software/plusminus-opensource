name: Maven Central Release
on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "21"
      module:
        required: false
        type: string
        default: ""
      create-git-tag:
        required: false
        type: boolean
        default: true
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MAVEN_CENTRAL_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Detect version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '[:space:]')
          echo "Project version: $VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve target modules
        id: scope
        env:
          INPUT_MODULE: ${{ inputs.module }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # 1) An explicit module input always wins (manual, targeted release).
          if [ -n "$INPUT_MODULE" ]; then
            echo "Explicit module input: $INPUT_MODULE"
            echo "modules=$INPUT_MODULE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2) Only auto-detect on push. Anything else -> build all (empty).
          if [ "$EVENT_NAME" != "push" ]; then
            echo "No module input and event is '$EVENT_NAME' -> building all modules"
            echo "modules=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3) Unknown/absent base commit (first push, force-push) -> build all.
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit '$BASE_SHA' unavailable -> building all modules"
            echo "modules=" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          # 4) Root pom / build config / CI change affects everything -> build all.
          if echo "$CHANGED" | grep -qE '^(pom\.xml|\.mvn/|\.github/)'; then
            echo "Root or shared build files changed -> building all modules"
            echo "modules=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 5) Map each changed top-level dir that is a Maven module (has pom.xml).
          MODULES=$(echo "$CHANGED" | cut -d/ -f1 | sort -u | while read -r d; do
            if [ -n "$d" ] && [ -f "$d/pom.xml" ]; then echo "$d"; fi
          done | paste -sd, -)

          # 6) Changes but none inside a module dir -> build all to be safe.
          if [ -z "$MODULES" ]; then
            echo "No changed Maven module directories matched -> building all modules"
            echo "modules=" >> $GITHUB_OUTPUT
          else
            echo "Detected changed modules: $MODULES"
            echo "modules=$MODULES" >> $GITHUB_OUTPUT
          fi

      - name: Deploy SNAPSHOT
        if: steps.version.outputs.is_snapshot == 'true'
        env:
          MODULES: ${{ steps.scope.outputs.modules }}
        run: |
          CMD="mvn -B -ntp clean deploy -DaltDeploymentRepository=central::default::https://central.sonatype.com/repository/maven-snapshots/"

          # If a module scope was resolved, limit the reactor to it.
          if [ -n "$MODULES" ]; then
            echo "Targeting modules: $MODULES"
            # -pl: project list, -am: also make (build dependencies)
            CMD="$CMD -pl $MODULES -am"
          fi

          # Execute the command
          $CMD

      - name: Import GPG Key
        if: steps.version.outputs.is_snapshot == 'false' && github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish Release
        if: steps.version.outputs.is_snapshot == 'false' && github.event_name == 'workflow_dispatch'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MODULES: ${{ steps.scope.outputs.modules }}
        run: |
          CMD="mvn -B -ntp clean deploy -Prelease \
            -Dgpg.passphrase=\"$GPG_PASSPHRASE\" \
            -Dgpg.arguments='--pinentry-mode=loopback'"

          if [ -n "$MODULES" ]; then
            echo "Publishing modules: $MODULES"
            CMD="$CMD -pl $MODULES -am"
          fi

          eval $CMD

      - name: Tag commit with Maven version
        if: ${{ inputs.create-git-tag == true && (steps.version.outputs.is_snapshot == 'true' || github.event_name == 'workflow_dispatch') }}
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODULE="${{ inputs.module }}"
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Determine tag
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="${VERSION}-${SHORT_SHA}"
          else
            TAG="$VERSION"
          fi
          
          # Include module name if provided
          if [ -n "$MODULE" ]; then
            TAG="${MODULE}-${TAG}"
          fi
          
          echo "Tagging commit with: $TAG"
          
          # Skip if tag exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            exit 0
          fi
          
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish job summary
        env:
          MODULES: ${{ steps.scope.outputs.modules }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          
          if [[ "${{ steps.version.outputs.is_snapshot }}" == "true" ]]; then
            TYPE="SNAPSHOT"
          else
            TYPE="RELEASE"
          fi

          # Release publish is skipped for non-SNAPSHOT versions on automatic (non-dispatch) runs
          if [[ "${{ steps.version.outputs.is_snapshot }}" == "false" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            SKIPPED=true
          else
            SKIPPED=false
          fi

          if [[ "$SKIPPED" == "true" ]]; then
            echo "## Maven Central Publish Skipped ⏭️" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Maven Central Publish Result 🚀" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** $TYPE" >> $GITHUB_STEP_SUMMARY

          if [ -n "$MODULES" ]; then
            echo "- **Modules:** $MODULES" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Modules:** (all)" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "$SKIPPED" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ⚠️ **Not released.** A non-SNAPSHOT version is only published on a manual \`workflow_dispatch\` run. This was a \`${{ github.event_name }}\` run, so the release, GPG signing, and tagging steps were skipped." >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$TAG" ]; then
            echo "- **Git tag:** $TAG" >> $GITHUB_STEP_SUMMARY
          fi