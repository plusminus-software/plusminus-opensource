name: Maven Central Release
on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "21"
      module:
        required: false
        type: string
        default: ""
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MAVEN_CENTRAL_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Detect version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '[:space:]')
          echo "Project version: $VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy SNAPSHOT
        if: steps.version.outputs.is_snapshot == 'true'
        run: |
          CMD="mvn -B -ntp clean deploy -DaltDeploymentRepository=central::default::https://central.sonatype.com/repository/maven-snapshots/"

          # If the 'module' input is provided and not empty
          if [ -n "${{ inputs.module }}" ]; then
            echo "Targeting specific module: ${{ inputs.module }}"
            # -pl: project list, -am: also make (build dependencies)
            CMD="$CMD -pl ${{ inputs.module }} -am"
          fi

          # Execute the command
          $CMD

      - name: Import GPG Key
        if: steps.version.outputs.is_snapshot == 'false'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish Release
        if: steps.version.outputs.is_snapshot == 'false'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          CMD="mvn -B -ntp clean deploy \
            -Dgpg.passphrase=\"$GPG_PASSPHRASE\" \
            -Dgpg.arguments='--pinentry-mode=loopback' \
            -Dgpg.attach=true \
            -DpublishingServerId=central \
            -DautoPublish=true \
            -DwaitUntil=published \
            -DskipTests"
          
          if [ -n "${{ inputs.module }}" ]; then
            echo "Publishing specific module: ${{ inputs.module }}"
            CMD="$CMD -pl ${{ inputs.module }} -am"
          fi
          
          eval $CMD